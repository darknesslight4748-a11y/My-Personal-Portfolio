 modal("Edit portfolio",`<label class="lbl">Profile picture</label>${up("photo",D.photo)}${f("name","Full name")}${f("title","Job title")}${f("tagline","Short intro")}${f("email","Email")}${f("phone","Contact number")}${f("address","Address")}${f("about","About me",5)}<label class="lbl">Skills (comma separated)</label><input id="f_skills" value="${E(D.skills.join(", "))}" class="inp">${h("SOCIAL / WEBSITE LINKS")}${rep("links")}${h("EDUCATION")}${rep("education")}${h("WORK EXPERIENCE")}${rep("experience")}`,async o=>{
  ["name","title","tagline","email","phone","address","about"].forEach(k=>D[k]=o.querySelector("#f_"+k).value.trim());
  D.photo=o.querySelector("[data-img=photo]")?.dataset.id??D.photo;
  D.skills=o.querySelector("#f_skills").value.split(",").map(s=>s.trim()).filter(Boolean);
  ["links","education","experience"].forEach(k=>D[k]=collect(o,k));await persist()});
}
function projForm(i){
 const p=D.projects[i]||{};const f=(k,l,v,r)=>`<label class="lbl">${l}</label>`+(r?`<textarea id="p_${k}" rows="${r}" class="inp">${E(v)}</textarea>`:`<input id="p_${k}" value="${E(v)}" class="inp">`);
 modal(i<0?"Add project":"Edit project",`${f("title","Title",p.title)}${f("desc","Description",p.desc,3)}${f("tags","Tags (comma separated)",(p.tags||[]).join(", "))}${f("link","Project link (optional)",p.link)}<label class="lbl">Project image</label>${up("image",p.image||"")}`,async o=>{
  const n={title:o.querySelector("#p_title").value.trim()||"Untitled project",desc:o.querySelector("#p_desc").value.trim(),tags:o.querySelector("#p_tags").value.split(",").map(s=>s.trim()).filter(Boolean),link:o.querySelector("#p_link").value.trim(),image:o.querySelector("[data-img=image]")?.dataset.id??(p.image||"")};
  if(i<0)D.projects.push(n);else D.projects[i]=n;await persist()},i<0?null:async()=>{D.projects.splice(i,1);await persist()});
}
function render(){
 const d=D,ini=(d.name||"?").split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
 const photo=d.photo?`<img src="${IMG(d.photo)}" alt="${E(d.name)}" class="w-full h-full object-cover">`:`<div class="w-full h-full flex items-center justify-center font-fs text-7xl text-primary bg-surface-container">${E(ini)}</div>`;
 const pill=(ic,t,h)=>t?`<a ${h?`href="${U(h)}"`:""} class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant font-fm text-xs hover:bg-surface-container-high"><span class="ms text-primary">${ic}</span>${E(t)}</a>`:"";
 const links=(d.links||[]).map(l=>`<a href="${U(l.url)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 hover:text-primary">${E(l.label)}<span class="ms" style="font-size:13px">arrow_outward</span></a>`).join("");
 const sec=(id,n,t,b,x="")=>`<section id="${id}" class="${n%2?"bg-surface-container-lowest/70":""} py-12"><div class="max-w-[1100px] mx-auto px-5 md:px-12"><div class="flex items-end justify-between gap-3 mb-6"><div><div class="font-fm text-xs text-primary">0${n} // ${t.toUpperCase()}</div><h2 class="font-fs text-3xl md:text-4xl mt-1">${t}</h2></div>${x}</div>${b}</div></section>`;
 const card=(a,b,c,e)=>`<div class="p-4 rounded-xl bg-surface-container"><div class="flex flex-wrap justify-between gap-1"><h3 class="font-semibold">${E(a)}</h3><span class="font-fm text-xs text-primary">${E(c)}</span></div><div class="text-sm text-on-surface-variant">${E(b)}</div>${e?`<p class="text-sm mt-2 text-on-surface-variant">${E(e)}</p>`:""}</div>`;
 const proj=(p,i)=>`<article class="rounded-xl bg-surface-container overflow-hidden flex flex-col"><div class="aspect-video bg-surface-container-high">${p.image?`<img src="${IMG(p.image)}" alt="${E(p.title)}" loading="lazy" class="w-full h-full object-cover">`:`<div class="w-full h-full flex items-center justify-center text-outline"><span class="ms" style="font-size:40px">image</span></div>`}</div><div class="p-4 flex flex-col gap-2 flex-1"><h3 class="font-semibold text-lg">${E(p.title)}</h3><p class="text-sm text-on-surface-variant">${E(p.desc)}</p><div class="flex flex-wrap gap-1.5">${(p.tags||[]).map(t=>`<span class="chip">${E(t)}</span>`).join("")}</div><div class="mt-auto pt-2 flex items-center justify-between">${p.link?`<a href="${U(p.link)}" target="_blank" rel="noopener noreferrer" class="text-sm text-primary inline-flex items-center gap-1">View project<span class="ms" style="font-size:14px">arrow_outward</span></a>`:"<span></span>"}${owner?`<button type="button" data-ep="${i}" class="text-xs text-on-surface-variant hover:text-primary">Edit</button>`:""}</div></div></article>`;
 const about=(d.about||"").split("\n").filter(Boolean).map((t,i)=>`<p class="${i?"text-on-surface-variant":"text-lg"} leading-relaxed">${E(t)}</p>`).join("");
 $("#app").innerHTML=`<header class="sticky z-50 bg-surface/95" style="top:env(safe-area-inset-top,0px)"><div class="h-16 max-w-[1100px] mx-auto px-5 md:px-12 flex items-center justify-between gap-3"><a href="#top" class="flex items-center gap-2 min-w-0"><span class="w-9 h-9 shrink-0 rounded-lg bg-surface-container-high flex items-center justify-center font-fm text-xs font-semibold text-primary">${E(ini)}</span><span class="flex flex-col min-w-0"><span class="font-semibold leading-tight truncate">${E(d.name)}</span><span class="font-fm text-[10px] uppercase tracking-wider text-outline truncate">${E(d.title)}</span></span></a><nav class="hidden lg:flex gap-5 text-sm text-on-surface-variant">${["About","Experience","Projects","Skills","Education","Contact"].map(x=>`<a href="#${x.toLowerCase()}" class="hover:text-on-surface">${x}</a>`).join("")}</nav>${owner?`<button type="button" id="editBtn" class="btnp inline-flex items-center gap-1 shrink-0"><span class="ms">edit</span>Edit</button>`:`<a href="#contact" class="btnp inline-flex items-center gap-1 shrink-0 no-underline"><span class="ms">send</span>Contact</a>`}</div></header>
<main id="top"><section class="relative overflow-hidden"><div class="relative max-w-[1100px] mx-auto px-5 md:px-12 pt-10 pb-14 grid lg:grid-cols-12 gap-8 items-center">
<div class="lg:col-span-7 flex flex-col gap-4 order-2 lg:order-1"><div class="inline-flex self-start items-center gap-2 px-3 py-1 rounded-full bg-surface-container-high"><span class="w-2 h-2 rounded-full bg-tertiary animate-pulse"></span><span class="font-fm text-xs text-tertiary uppercase">${owner?"Owner mode":"Open to opportunities"}</span></div><div><div class="font-fm text-xs text-primary uppercase tracking-widest">${E(d.title)}</div><h1 class="font-fs text-5xl md:text-6xl leading-none tracking-tight mt-2">${E(d.name)}</h1></div><p class="text-lg text-on-surface-variant max-w-xl">${E(d.tagline)}</p>
<div class="flex flex-wrap gap-2">${pill("mail",d.email,d.email&&"mailto:"+d.email)}${pill("call",d.phone,d.phone&&"tel:"+d.phone.replace(/[^\d+]/g,""))}${pill("location_on",d.address,"")}</div>
<div class="flex flex-wrap items-center gap-x-4 gap-y-1 font-fm text-xs text-outline"><span class="uppercase tracking-wider">Links:</span>${links}</div>
<div class="flex flex-wrap gap-2 pt-1"><a href="#projects" class="btnp no-underline inline-flex items-center gap-1"><span class="ms">work</span>View work</a><a href="#contact" class="btn2 no-underline inline-flex items-center gap-1"><span class="ms">send</span>Get in touch</a></div></div>
<div class="lg:col-span-5 flex justify-center lg:justify-end order-1 lg:order-2"><div class="relative w-64 h-64 md:w-80 md:h-80"><div class="absolute inset-0 rounded-full bg-gradient-to-tr from-primary/30 to-secondary/30 blur-2xl scale-105"></div><div class="relative w-full h-full rounded-2xl overflow-hidden shadow-2xl bg-surface-container-low p-1.5"><div class="w-full h-full rounded-xl overflow-hidden">${photo}</div></div></div></div></div></section>
${sec("about",1,"About me",`<div class="grid lg:grid-cols-12 gap-8"><div class="lg:col-span-7 flex flex-col gap-4">${about}</div><div class="lg:col-span-5 grid gap-3 content-start">${card("Location",d.address,"","")}${card("Email",d.email,"","")}${card("Phone",d.phone,"","")}</div></div>`)}
${sec("experience",2,"Experience",`<div class="grid md:grid-cols-2 gap-3">${(d.experience||[]).map(x=>card(x.role,x.company,x.years,x.desc)).join("")||'<p class="text-outline">No experience added yet.</p>'}</div>`)}
${sec("projects",3,"Projects",`<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${(d.projects||[]).map(proj).join("")||'<p class="text-outline">No projects yet.</p>'}</div>`,owner?`<button type="button" id="addProj" class="btnp inline-flex items-center gap-1 shrink-0"><span class="ms">add</span>Add project</button>`:"")}
${sec("skills",4,"Skills",`<div class="flex flex-wrap gap-2">${(d.skills||[]).map(s=>`<span class="px-4 py-2 rounded-full bg-surface-container text-sm">${E(s)}</span>`).join("")}</div>`)}
${sec("education",5,"Education",`<div class="grid md:grid-cols-2 gap-3">${(d.education||[]).map(x=>card(x.school,x.degree,x.years,"")).join("")||'<p class="text-outline">No education added yet.</p>'}</div>`)}
${sec("contact",6,"Contact",`<div class="grid md:grid-cols-3 gap-3 mb-6">${[["mail","Email",d.email,d.email&&"mailto:"+d.email],["call","Phone",d.phone,d.phone&&"tel:"+d.phone.replace(/[^\d+]/g,"")],["location_on","Address",d.address,""]].map(([i,l,v,h])=>`<${h?`a href="${U(h)}"`:"div"} class="p-4 rounded-xl bg-surface-container block"><div class="font-fm text-xs text-outline uppercase flex items-center gap-1"><span class="ms text-primary">${i}</span>${l}</div><div class="mt-1 break-words">${E(v)}</div></${h?"a":"div"}>`).join("")}</div><div class="flex flex-wrap gap-x-5 gap-y-2 font-fm text-sm text-on-surface-variant">${links}</div>`)}
</main><footer class="py-8 text-center font-fm text-xs text-outline">© ${new Date().getFullYear()} ${E(d.name)}</footer>`;
 $("#editBtn")&&($("#editBtn").onclick=profForm);$("#addProj")&&($("#addProj").onclick=()=>projForm(-1));
 document.querySelectorAll("[data-ep]").forEach(b=>b.onclick=()=>projForm(+b.dataset.ep));reveal();
}
render();
function reveal(){
 if(io){io.disconnect();io=null}
 if(!("IntersectionObserver" in window)||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const t=e.target;t.classList.add("in");seen.add(t._i);io.unobserve(t);t.addEventListener("transitionend",()=>{t.style.transitionDelay="0s"},{once:true})}}),{threshold:.12,rootMargin:"0px 0px -6% 0px"});
 document.querySelectorAll("main section:first-child .grid>div,main section:not(:first-child)>div>div:first-child,main .p-4.rounded-xl,main article,main span.px-4.py-2,main section p.leading-relaxed").forEach((el,i)=>{
  el._i=i;el.classList.add("rv");
  if(seen.has(i)){el.classList.add("in","nt")}else{el.style.transitionDelay=Math.min([...el.parentNode.children].indexOf(el),6)*80+"ms";io.observe(el)}});
}
let tk=0;addEventListener("scroll",()=>{if(tk)return;tk=requestAnimationFrame(()=>{tk=0;const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;$("#prog").style.transform=`scaleX(${h>0?Math.min(y/h,1):0})`})},{passive:true});
(async()=>{try{const c=window.claude;if(!c||!c.use)return;
 const user=await c.use("user");owner=user?await user.isOwner():false;
 assets=owner?await c.use("assets"):null;
 
 
 render()}catch(e){}})();
</script></body></html>
